# Nosso Diário — encaminha /diario pro app Next.js (PM2, porta 3010).
# Instalado em /etc/apache2/conf-available/diario.conf pelo instalar-vps.sh.
<IfModule mod_proxy.c>
    ProxyTimeout 300
    ProxyPass        /diario http://127.0.0.1:3010/diario
    ProxyPassReverse /diario http://127.0.0.1:3010/diario

    <Location /diario>
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
        # Vídeos de até 200 MB no upload
        LimitRequestBody 220000000
    </Location>
</IfModule>
